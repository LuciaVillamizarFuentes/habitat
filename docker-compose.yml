services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: habitat
      POSTGRES_PASSWORD: habitat
      POSTGRES_DB: habitat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro # TODO(T-08): reemplazar por una herramienta de migraciones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitat"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TODO(T-20): añadir redis (caché / rate limiting) y nats (eventos).

  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://habitat:habitat@postgres:5432/habitat?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
